name: Reload IDC tables on Galaxy Test

on:
  workflow_dispatch:
    inputs:
      section:
        description: Data tables to reload after CVMFS replication
        required: true
        type: choice
        options:
          - virsorter
          - savont-and-spacy

permissions: {}

jobs:
  reload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reload selected tables on Galaxy Test
        env:
          GALAXY_API_KEY: ${{ secrets.TEST_API_KEY }}
          IDC_SECTION: ${{ inputs.section }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          tables = {
              "virsorter": {"virsorter": 1},
              "savont-and-spacy": {"savont_dbs": 4, "spacy_models": 70},
          }
          api_key = os.environ["GALAXY_API_KEY"]
          assert api_key, "Galaxy API key is unavailable"
          for table, expected in tables[os.environ["IDC_SECTION"]].items():
              request = Request(
                  f"https://test.galaxyproject.org/api/tool_data/{table}/reload",
                  headers={"x-api-key": api_key, "Accept": "application/json"},
              )
              with urlopen(request, timeout=30) as response:
                  rows = json.load(response)["fields"]
              print(f"{table} has {len(rows)} entries after reload")
              assert len(rows) >= expected, f"Expected at least {expected} entries in {table}"
          PY

# Stage 3 of the reference-data pipeline: import the bundles that build.yml built
# on test.galaxyproject.org onto CVMFS and publish (.ci/github-actions.sh).
#
# Run manually once the build histories (idc-<dm>-<version>) are green: a
# build runs asynchronously for hours after its request merges, so publishing
# on merge would race it. import_bundles.py refuses bundles whose datasets are
# not in the ok state, so a premature run fails loudly rather than publishing
# a partial build.
#
# Runs on the org's self-hosted cvmfs-publish runner (docs/cvmfs-publish-actions.md):
# the Stratum 0 only accepts SSH from inside its network, and the runner group
# is restricted to this workflow on the default branch.
#
# After a real publish, the after-publish job waits for the Stratum 1s to pick up
# the new revision on their hourly snapshot and checks the published data table
# rows show up on test.galaxyproject.org (scripts/after_publish.py).
name: Publish reference data to CVMFS

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the CVMFS transaction (false = import, then abort: a rehearsal)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on:
      group: cvmfs-publish
      labels: cvmfs
    # Holds the Stratum 0 key and the Galaxy key; only this job and after-publish
    # use the environment, and only this one reads the Stratum 0 key.
    environment: cvmfs-publish
    # A self-hosted job may run up to 5 days; the import itself is minutes to an
    # hour (dominated by installing galaxy-maintenance-scripts on the Stratum 0).
    timeout-minutes: 300
    outputs:
      # '<loc file>\t<row>' per data table row the published transaction added,
      # written only once the transaction is published: empty for a rehearsal,
      # a failed publish, or when no row was added.
      published_entries: ${{ steps.import.outputs.published_entries }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start ssh-agent with the Stratum 0 key
        env:
          STRATUM0_SSH_KEY: ${{ secrets.STRATUM0_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$STRATUM0_SSH_KEY" | ssh-add -

      - name: Import reference-data bundles and publish
        id: import
        env:
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
          REFERENCE_DATA_API_KEY: ${{ secrets.REFERENCE_DATA_API_KEY }}
        run: .ci/github-actions.sh

      - name: Summarize
        if: always()
        env:
          PUBLISHED: ${{ inputs.publish && job.status == 'success' }}
        run: |
          {
            echo "## Reference data → CVMFS: ${{ job.status }}"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- published: ${PUBLISHED}"
            echo "- requests:"
            for req in data-managers/*/*.yaml data-managers/*/*.yml; do
              if [ -e "$req" ]; then echo "  - \`${req}\`"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop ssh-agent
        if: always()
        run: ssh-agent -k || true

  after-publish:
    needs: publish
    # Skipped for a rehearsal and when the publish added no data table row. The
    # output exists only after a successful cvmfs_server publish, so a step
    # failing after that (e.g. Summarize) must not skip the check: !cancelled()
    # rather than the implicit success(), and not always(), so a cancelled run
    # does not start two hours of waiting.
    if: ${{ !cancelled() && inputs.publish && needs.publish.outputs.published_entries != '' }}
    # GitHub-hosted on purpose: this mostly sleeps, for up to two hours, and
    # needs only public HTTP and the Galaxy key - it must not hold the shared
    # cvmfs-publish runner that usegalaxy-tools deploys from.
    runs-on: ubuntu-latest
    # For REFERENCE_DATA_API_KEY (an admin key on test.galaxyproject.org).
    environment: cvmfs-publish
    # Up to 90 minutes for the Stratum 1s, then up to 30 for Galaxy.
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # check_data_exists.py, whose table lookup the script reuses, imports these.
        run: pip install "pydantic>=2" pyyaml

      - name: Wait for the Stratum 1s, reload and verify on test.galaxyproject.org
        env:
          PUBLISHED_ENTRIES: ${{ needs.publish.outputs.published_entries }}
          REFERENCE_DATA_API_KEY: ${{ secrets.REFERENCE_DATA_API_KEY }}
        run: python scripts/after_publish.py

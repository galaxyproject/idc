name: Cancel the superseded hg38canon build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop the superseded Test Galaxy job
        env:
          GALAXY_API_KEY: ${{ secrets.TEST_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          galaxy_url = "https://test.galaxyproject.org"
          headers = {"x-api-key": os.environ["GALAXY_API_KEY"]}
          tool_id = "toolshed.g2.bx.psu.edu/repos/iuc/data_manager_star_index_builder/rna_star_index_builder_data_manager/2.7.4a+galaxy4"
          old_path = "/api/jobs/10dbe5d975f320e3"
          replacement_path = "/api/jobs/d21fd6b7b5bb947c"

          def api(path, method="GET"):
              request = Request(galaxy_url + path, headers=headers, method=method)
              with urlopen(request, timeout=25) as response:
                  return json.load(response)

          replacement = api(replacement_path + "?full=true")
          if (
              replacement["tool_id"] != tool_id
              or replacement["history_id"] != "b1251ce3b0e2e90f8709544748fa5b90"
              or replacement["params"].get("auto_chr_bin_nbits") not in (True, "true")
              or replacement["state"] not in {"new", "queued", "running", "ok"}
          ):
              raise SystemExit("The expected replacement job is unavailable.")

          old = api(old_path + "?full=true")
          if (
              old["tool_id"] != tool_id
              or old["history_id"] != "b1251ce3b0e2e90fb0b1162f4936c645"
              or old["params"].get("auto_chr_bin_nbits") not in (False, "false")
          ):
              raise SystemExit("The superseded job did not match the expected build.")
          if old["state"] in {"new", "queued", "running", "waiting", "resubmitted", "paused"}:
              stopped = api(old_path, method="DELETE")
              state = api(old_path)["state"]
              print(f"Superseded job cancellation accepted: {stopped}. Current state: {state}.")
          else:
              print(f"Superseded job already reached state {old['state']}.")
          PY

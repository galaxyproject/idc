name: Refresh the hg38canon STAR row on Test
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Published IDC CVMFS revision
        required: true
        type: number
permissions:
  contents: read
jobs:
  reload:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Reload the STAR table after CVMFS replication
        env:
          GALAXY_API_KEY: ${{ secrets.TEST_API_KEY }}
          IDC_REVISION: ${{ inputs.revision }}
        run: |
          python3 -u - <<'PY'
          import json
          import os
          import re
          import time
          from pathlib import PurePosixPath
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          key = os.environ["GALAXY_API_KEY"]
          want_revision = int(os.environ["IDC_REVISION"])
          mirror = "http://cvmfs1-tacc0.galaxyproject.org/cvmfs/idc.galaxyproject.org/.cvmfspublished"
          table = "https://test.galaxyproject.org/api/tool_data/rnastar_index2x_versioned"
          heads = {"x-api-key": key, "Accept": "application/json"}

          def fetch(url, headers=None):
              with urlopen(Request(url, headers=headers or {}), timeout=25) as response:
                  return response.read()

          def star_row(payload):
              rows = [
                  row for row in json.loads(payload)["fields"]
                  if row[0] == "hg38canon" and str(row[4]) == "0" and row[5] == "2.7.4a"
              ]
              if len(rows) == 1 and rows[0][1] == "hg38":
                  return PurePosixPath(rows[0][3]).name
              return "missing or duplicate"

          deadline = time.monotonic() + 5400
          while time.monotonic() < deadline:
              try:
                  manifest = fetch(mirror).split(b"\n--\n", 1)[0]
                  match = re.search(rb"^S([0-9]+)$", manifest, re.MULTILINE)
                  revision = int(match[1]) if match else -1
                  if revision >= want_revision:
                      current = star_row(fetch(f"{table}/reload", heads))
                      print(f"Test STAR row after reload: {current}")
                      if current == "hg38canon-chrbin18":
                          params = fetch(f"{table}/fields/hg38canon/files/genomeParameters.txt", heads)
                          assert re.search(rb"^genomeChrBinNbits\s+18$", params, re.MULTILINE)
                          print("Verified hg38canon-chrbin18 and genomeChrBinNbits=18 on Test.")
                          break
                  else:
                      print(f"TACC CVMFS mirror revision {revision}. Waiting for {want_revision}.")
              except HTTPError as exc:
                  if exc.code in {401, 403}:
                      raise SystemExit(f"Test STAR table reload authorization failed with HTTP {exc.code}.")
                  print(f"Waiting after HTTP {exc.code}.")
              except (TimeoutError, URLError) as exc:
                  print(f"Transient connection problem: {type(exc).__name__}.")
              time.sleep(45)
          else:
              raise SystemExit("Test did not expose the replacement STAR index before the timeout.")
          PY

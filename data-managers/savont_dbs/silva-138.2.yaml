# yaml-language-server: $schema=https://raw.githubusercontent.com/galaxyproject/idc/main/schemas/request.schema.json
# Savont SILVA 16S rRNA reference database, SSU Ref NR99 v138.2
# (Quast et al. 2012, NAR): broad taxonomic coverage for long-read amplicon data.
# Standalone build: the data manager runs `savont download` and writes one
# savont_dbs row per selected database (value = the database keyword `silva-138.2`).
tool_id: toolshed.g2.bx.psu.edu/repos/iuc/data_manager_savont_dbs/data_manager_savont_dbs/0.9.0+galaxy0
data_tables:
  - savont_dbs
params:
  dbs: ["silva-138.2"]   # the tool's "Reference databases to download" multi-select param
description: Savont SILVA 16S rRNA reference database, v138.2
doi: 10.1093/nar/gks1219

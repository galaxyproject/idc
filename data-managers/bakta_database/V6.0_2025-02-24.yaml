# yaml-language-server: $schema=https://raw.githubusercontent.com/galaxyproject/idc/main/schemas/request.schema.json
# Bakta database V6.0 (2025-02-24), full version, from Zenodo record 14916843.
# Standalone build: the data manager downloads the DB by version. It writes
# value V6.0_2025-02-24, dbkey 14916843 and bakta_version 1.11 (the DB's
# minimum Bakta version), the row the bakta 1.12.x wrapper filters for.
tool_id: toolshed.g2.bx.psu.edu/repos/iuc/data_manager_bakta/bakta_build_database/1.12.1+galaxy0
data_tables:
  - bakta_database
params:
  database_select: "6.0"   # the tool's "Database version" select param
description: Bakta annotation database V6.0 (2025-02-24), full version, for Bakta >= 1.11
doi: 10.5281/zenodo.14916843
